
# Login tokens (JWT, HS256). Set JWT_SECRET to a long random string (at least 32 bytes) outside local development.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-before-deploying-0123456789}
app.jwt.expiry=8h
# Lets the unique index on users.email be created, so two accounts can never share an email.
spring.data.mongodb.auto-index-creation=true
# A missing or null field such as experience[].current means false, instead of a 400 (Jackson 3 is strict by default).
spring.jackson.deserialization.fail-on-null-for-primitives=false
